<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Reset password | MediCore</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet"><link href="css/auth.css" rel="stylesheet">
</head>
<body class="auth-page">
  <main class="auth-layout">
    <aside class="auth-visual"><a class="brand text-decoration-none" href="login.html"><img class="brand-logo" src="images/medicore-logo-cropped.png" alt="MediCore Hospital"></a><div class="auth-hero"><div class="auth-kicker"><i class="bi bi-shield-lock"></i> Account security</div><h2>Choose a new password.</h2><p>Use a strong password that you don’t use for another account.</p></div><div class="auth-visual-foot">Your account security matters.</div></aside>
    <section class="auth-content"><div class="auth-form-wrap">
      <a class="brand auth-mobile-brand text-decoration-none" href="login.html"><img class="brand-logo" src="images/medicore-logo-cropped.png" alt="MediCore Hospital"></a>
      <div class="auth-heading"><div class="auth-step">Account recovery</div><h1>Reset your password</h1><p>Choose a new password with at least 12 characters.</p></div>
      <div class="alert alert-danger d-none auth-error" id="resetError" role="alert"></div>
      <form class="auth-form" id="resetPasswordForm">
        <div><label class="form-label" for="newPassword">New password</label><input class="form-control" id="newPassword" name="password" type="password" minlength="12" maxlength="128" required autocomplete="new-password"></div>
        <div><label class="form-label" for="confirmPassword">Confirm new password</label><input class="form-control" id="confirmPassword" name="confirmPassword" type="password" minlength="12" maxlength="128" required autocomplete="new-password"></div>
        <button class="btn btn-primary auth-submit" type="submit">Update password <i class="bi bi-arrow-right ms-2"></i></button>
      </form>
      <p class="auth-switch mt-4"><a href="login.html">Return to Login</a></p>
    </div></section>
  </main>
  <script src="js/api.js"></script><script src="js/password-reset.js"></script><script src="js/motion.js"></script>
</body>
</html>
